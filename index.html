<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Netflix-pro</title>
    <meta name="description" content="Decrypted HD streaming for movies, TV series, and anime." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Set the theme before first paint so a light-mode visitor never sees a
      // dark flash. The theme is device-driven — no stored override — so this
      // only reads the media query. Kept inline and dependency-free for that.
      (function () {
        try {
          var light =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = light ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
